services:

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: jargas-portable-app
        restart: unless-stopped
        ports:
            - "8000:8000"
        env_file:
            - .env.docker
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:8.4
        container_name: jargas-portable-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: jargas_database
            MYSQL_USER: jargas
            MYSQL_PASSWORD: jargas_password
            MYSQL_ROOT_PASSWORD: root_password
        volumes:
            - jargas_db_data:/var/lib/mysql
        healthcheck:
            test:
              [
                  "CMD",
                  "mysqladmin",
                  "ping",
                  "-h",
                  "localhost",
                  "-u",
                  "root",
                  "-proot_password"
              ]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    jargas_db_data:
